# Example: Nginx Proxy Manager Private CA with an existing StepCA server
#
# This example builds the Docker image locally from this repository.
# It does NOT assume the image already exists on Docker Hub or GHCR.
#
# Folder layout expected:
#
# nginx-proxy-manager-private-ca/
# ├── docker/
# │   ├── Dockerfile
# │   └── 80-private-ca.sh
# └── examples/
#     └── docker-compose.stepca.yml
#
# Run from the examples folder:
# docker compose -f docker-compose.stepca.yml up -d --build

services:
  npm:
    build:
      context: ../docker
      dockerfile: Dockerfile

    image: nginx-proxy-manager-private-ca:local
    container_name: npm-private-ca
    restart: unless-stopped

    ports:
      - '80:80'
      - '81:81'
      - '443:443'

    environment:
      # Private ACME directory URL.
      # Example for StepCA:
      - ACME_SERVER=https://ca.home.arpa:9000/acme/acme/directory

      # Optional. Only required if your ACME CA uses External Account Binding.
      - ACME_EAB_KID=
      - ACME_EAB_HMAC_KEY=

      # Optional. Defaults to /data/letsencrypt-acme-challenge.
      - ACME_WEBROOT=/data/letsencrypt-acme-challenge

    volumes:
      # Nginx Proxy Manager persistent data.
      - ./npm/data:/data

      # Certificate storage.
      - ./npm/letsencrypt:/etc/letsencrypt

      # Private CA certificates mounted into the container trust store.
      # Put your Root CA and any Intermediate CA certificates here.
      - ./ca-certs:/usr/local/share/ca-certificates:ro
